[project]
name = "dyn-login"
version = "0.1.0"
description = "Configurable login forms for browser extension testing"
requires-python = ">=3.12"
dependencies = [
  "boto3>=1.40,<2",
  "flask>=3.1,<4",
  "gunicorn>=23,<24",
  "itsdangerous>=2.2,<3",
]

[dependency-groups]
dev = [
  "moto[dynamodb]>=5,<6",
  "mypy>=1.18,<2",
  "playwright>=1.55,<2",
  "pytest>=8,<10",
  "ruff>=0.13,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["browser: exercises the rendered website in Chromium"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["dyn_login"]

[[tool.mypy.overrides]]
module = ["boto3.*", "botocore.*"]
ignore_missing_imports = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
